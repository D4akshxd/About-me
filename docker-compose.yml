version: '3.8'

services:
  tdl-remover:
    build: .
    container_name: tdl-expiry-remover
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    
  nginx:
    image: nginx:alpine
    container_name: tdl-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - tdl-remover
    restart: unless-stopped